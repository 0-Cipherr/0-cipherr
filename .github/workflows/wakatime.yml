name: WakaTime Stats Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Waka README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          REPOSITORY: "0-Cipherr/0-cipherr" # Explicitly routes to your profile
          SECTION_NAME: "waka"
          TIME_RANGE: "last_7_days" # Safer range for newer accounts
          SHOW_TITLE: true

